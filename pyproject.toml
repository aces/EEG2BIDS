[project]
name = "eeg2bids"
version = "3.0.0"
description = "EEG2BIDS Wizard backend: de-identifies EDF data and converts EEG/iEEG recordings to BIDS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "mne>=1.7",
    "mne-bids>=0.14",
    # MNE-BIDS export backends. MNE reads EDF/EEGLAB natively, but writing a
    # recording whose reader preloads data (e.g. EEGLAB) requires the matching
    # writer: edfio for EDF output, eeglabio for EEGLAB output, pybv for
    # BrainVision.
    "edfio>=0.4",
    "eeglabio>=0.0.2",
    "pybv>=0.7.5",
    "numpy>=1.26",
    "python-socketio>=5.11",
    "simple-websocket>=1.0",
    "werkzeug>=3.0",
    "requests>=2.32",
    "bids-validator>=1.14",
]

[project.scripts]
eeg2bids = "eeg2bids.server:main"

[dependency-groups]
# Test-only dependencies. Installed by default with `uv sync`; the backend
# suite runs with `uv run pytest`. Kept separate from runtime dependencies so
# the packaged application does not ship the test toolchain.
dev = [
    "pytest>=8",
]

# Build-time dependencies for freezing the backend into a standalone binary
# that the Electron app spawns without uv or a Python interpreter present.
# PyInstaller freezes eeg2bids/__main__.py; see docs/linux-packaging-design.md
# and #170 for the production-packaging approach. Installed on demand for the
# freeze step (`uv sync --group packaging`), not part of the runtime deps.
packaging = [
    "pyinstaller>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# xfail_strict makes an unexpected pass (XPASS) a failure: a regression test
# marked xfail for a known-open defect (e.g. #145) must be un-marked the moment
# the defect is fixed, rather than silently masking new behavior.
xfail_strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eeg2bids"]
